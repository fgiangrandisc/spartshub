name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producción
        run: npm run build:only
        env:
          # Se completan en Settings → Secrets and variables → Actions.
          # Si faltan, el build igual corre (el prerender las trata como
          # opcionales), pero el smoke test no va a poder ejercitar rutas
          # que dependen de datos reales de Supabase.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}

      - name: Instalar navegador para el smoke test
        run: npx playwright install --with-deps chromium

      - name: Smoke test (detecta crashes de JS al montar la app)
        run: node scripts/smoke-test.mjs
